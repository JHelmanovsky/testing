name: GarmentCode Automation Test

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  garmentcode-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Clone GarmentCode
        run: git clone --depth 1 https://github.com/maria-korosteleva/GarmentCode.git garmentcode
      - name: Install minimal GarmentCode runtime
        run: |
          python -m pip install --upgrade pip
          pip install -e ./garmentcode --no-deps
          pip install "numpy<2" scipy "pyyaml>=6.0" svgwrite svgpathtools psutil matplotlib CairoSVG
      - name: Run automated garment generation test
        run: python test-garmentcode-automation.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: garmentcode-test-output
          path: garmentcode-output/
