name: FreeSewing Automation Test

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  noble-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: freesewing-test-output
          path: output/
